syntax = "proto3";

package bank.auth.v1;

option go_package = "github.com/dso202/bank-platform/gen/go/bank/auth/v1;authv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// AuthService owns credentials, sessions, MFA and roles.
service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/v1/auth/verify-email"
      body: "*"
    };
  }
  rpc ResendCode(ResendCodeRequest) returns (ResendCodeResponse) {
    option (google.api.http) = {
      post: "/v1/auth/resend-code"
      body: "*"
    };
  }
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }
  rpc VerifyMfa(VerifyMfaRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/mfa/verify"
      body: "*"
    };
  }
  rpc Refresh(RefreshRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }
  rpc GetMe(GetMeRequest) returns (User) {
    option (google.api.http) = {get: "/v1/auth/me"};
  }
  rpc SetMfa(SetMfaRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/auth/mfa"
      body: "*"
    };
  }
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {
      post: "/v1/auth/password"
      body: "*"
    };
  }
  rpc GetJwks(GetJwksRequest) returns (GetJwksResponse) {
    option (google.api.http) = {get: "/v1/auth/jwks"};
  }

  // Admin
  rpc CreateStaffUser(CreateStaffUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/admin/users"
      body: "*"
    };
  }
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/v1/admin/users"};
  }
  rpc SetUserStatus(SetUserStatusRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/admin/users/{user_id}/status"
      body: "*"
    };
  }

  // Internal only (no HTTP route).
  rpc GetUser(GetUserRequest) returns (User);
}

message User {
  string id = 1;
  string email = 2;
  string phone = 3;
  string full_name = 4;
  repeated string roles = 5;
  string status = 6; // ACTIVE, PENDING_VERIFICATION, DISABLED
  bool email_verified = 7;
  bool mfa_enabled = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp last_login_at = 10;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string token_type = 4;
}

message RegisterRequest {
  string email = 1;
  string phone = 2;
  string password = 3;
  string full_name = 4;
}
message RegisterResponse {
  string user_id = 1;
  string message = 2;
}

message VerifyEmailRequest {
  string email = 1;
  string code = 2;
}
message VerifyEmailResponse {
  bool verified = 1;
}

message ResendCodeRequest {
  string email = 1;
}
message ResendCodeResponse {
  string message = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}
message LoginResponse {
  TokenPair tokens = 1;
  bool mfa_required = 2;
  string mfa_token = 3;
  User user = 4;
}

message VerifyMfaRequest {
  string mfa_token = 1;
  string code = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}
message LogoutResponse {}

message GetMeRequest {}

message SetMfaRequest {
  bool enabled = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}
message ChangePasswordResponse {}

message Jwk {
  string kid = 1;
  string kty = 2;
  string alg = 3;
  string use = 4;
  string n = 5;
  string e = 6;
}
message GetJwksRequest {}
message GetJwksResponse {
  repeated Jwk keys = 1;
}

message CreateStaffUserRequest {
  string email = 1;
  string full_name = 2;
  string password = 3;
  repeated string roles = 4;
  string phone = 5;
}

message ListUsersRequest {
  string query = 1;
  string role = 2;
  int32 page_size = 3;
  string page_token = 4;
}
message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

message SetUserStatusRequest {
  string user_id = 1;
  string status = 2;
}

message GetUserRequest {
  string user_id = 1;
}
