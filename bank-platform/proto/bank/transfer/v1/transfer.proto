syntax = "proto3";

package bank.transfer.v1;

option go_package = "github.com/dso202/bank-platform/gen/go/bank/transfer/v1;transferv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// TransferService orchestrates internal transfers as a saga and manages payees.
service TransferService {
  rpc CreateTransfer(CreateTransferRequest) returns (Transfer) {
    option (google.api.http) = {
      post: "/v1/transfers"
      body: "*"
    };
  }
  rpc GetTransfer(GetTransferRequest) returns (Transfer) {
    option (google.api.http) = {get: "/v1/transfers/{transfer_id}"};
  }
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse) {
    option (google.api.http) = {get: "/v1/transfers"};
  }
  rpc AddPayee(AddPayeeRequest) returns (Payee) {
    option (google.api.http) = {
      post: "/v1/payees"
      body: "*"
    };
  }
  rpc ListPayees(ListPayeesRequest) returns (ListPayeesResponse) {
    option (google.api.http) = {get: "/v1/payees"};
  }
  rpc DeletePayee(DeletePayeeRequest) returns (DeletePayeeResponse) {
    option (google.api.http) = {delete: "/v1/payees/{payee_id}"};
  }

  // Internal only: called by fraud-service when an analyst decides a review.
  rpc ResolveReview(ResolveReviewRequest) returns (Transfer);
}

message SagaStep {
  string name = 1;
  string status = 2; // OK, FAILED, SKIPPED, COMPENSATED
  string detail = 3;
  google.protobuf.Timestamp at = 4;
}

message Transfer {
  string id = 1;
  string user_id = 2;
  string from_account_id = 3;
  string from_account_number = 4;
  string to_account_id = 5;
  string to_account_number = 6;
  string to_name = 7;
  int64 amount = 8;
  string description = 9;
  string status = 10; // PENDING, PENDING_REVIEW, COMPLETED, FAILED, REJECTED
  string failure_reason = 11;
  string fraud_decision = 12;
  int32 fraud_score = 13;
  string ledger_entry_id = 14;
  string idempotency_key = 15;
  repeated SagaStep steps = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message CreateTransferRequest {
  string from_account_id = 1;
  string to_account_number = 2;
  int64 amount = 3;
  string description = 4;
  // Optional; the Idempotency-Key header takes precedence.
  string idempotency_key = 5;
}

message GetTransferRequest {
  string transfer_id = 1;
}

message ListTransfersRequest {
  int32 page_size = 1;
  string page_token = 2;
  string status = 3;
}
message ListTransfersResponse {
  repeated Transfer transfers = 1;
  string next_page_token = 2;
}

message Payee {
  string id = 1;
  string nickname = 2;
  string account_number = 3;
  string holder_name = 4;
  google.protobuf.Timestamp created_at = 5;
}

message AddPayeeRequest {
  string nickname = 1;
  string account_number = 2;
}

message ListPayeesRequest {}
message ListPayeesResponse {
  repeated Payee payees = 1;
}

message DeletePayeeRequest {
  string payee_id = 1;
}
message DeletePayeeResponse {}

message ResolveReviewRequest {
  string transfer_id = 1;
  bool approve = 2;
  string note = 3;
}
